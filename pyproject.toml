[project]
name = "broz-cli"
version = "1.2.3"
description = "The fastest and smartest Developer Workspace Manager. Create, template, learn, clone, and AI-assist your projects."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Sameet Patro", email = "sameetpatratsp2004@gmail.com" },
]
keywords = [
    "cli",
    "developer-tools",
    "scaffolding",
    "project-manager",
    "tui",
    "template",
    "ai",
    "workspace",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "textual>=0.80.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pygithub>=2.0",
    "httpx>=0.27.0",
    "rich>=13.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "textual-dev>=1.5.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
broz = "bro.cli.main:app"
bro = "bro.cli.main:app"

[project.urls]
Homepage = "https://github.com/sameetpatro/broz"
Repository = "https://github.com/sameetpatro/broz"
Documentation = "https://github.com/sameetpatro/broz#readme"
Issues = "https://github.com/sameetpatro/broz/issues"
Changelog = "https://github.com/sameetpatro/broz/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/bro",
    "/LICENSE",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["bro"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
